name: ${COMPOSE_PROJECT_NAME:-douyin}

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  STORAGE_STATE_ENCRYPTION_KEY: ${STORAGE_STATE_ENCRYPTION_KEY:?请在 .env 中设置 STORAGE_STATE_ENCRYPTION_KEY}
  PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-false}
  TZ: ${TZ:-Asia/Shanghai}

x-worker-common: &worker-common
  build:
    context: ../..
    dockerfile: deploy/centos/backend.Dockerfile
    args: &backend-build-args
      PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.0}
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
      DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
      PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST-https://cdn.npmmirror.com/binaries/playwright}
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: ${PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT:-120000}
  restart: unless-stopped
  init: true
  ipc: host
  environment: *backend-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-douyin}
      MYSQL_USER: ${MYSQL_USER:-douyin_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../docs/schema.mysql.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/centos/backend.Dockerfile
      args: *backend-build-args
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  login-worker:
    <<: *worker-common
    command:
      - xvfb-run
      - -a
      - -s
      - -screen 0 1280x900x24 -nolisten tcp
      - python
      - /app/backend/workers/login_worker.py

  browser-worker:
    <<: *worker-common
    command:
      - xvfb-run
      - -a
      - -s
      - -screen 0 1280x900x24 -nolisten tcp
      - python
      - /app/backend/workers/account_browser_worker.py

  task-worker:
    <<: *worker-common
    command:
      - xvfb-run
      - -a
      - -s
      - -screen 0 1280x900x24 -nolisten tcp
      - python
      - /app/backend/workers/task_worker.py
    deploy:
      replicas: ${TASK_WORKER_PROCESSES:-2}

  web:
    build:
      context: ../..
      dockerfile: deploy/centos/frontend.Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:24-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.28-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${PUBLIC_PORT:-80}:80

volumes:
  mysql-data:
  redis-data:
